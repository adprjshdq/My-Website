<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Website | Adipraja</title>
    <meta
      name="description"
      content="Portfolio of Adipraja Shidqi Apriliano, an Informatics Engineering student at Universitas Perjuangan Tasikmalaya focused on fullstack web development with React, Laravel, and Tailwind CSS."
    />
    <meta name="author" content="Adipraja Shidqi Apriliano" />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="canonical" href="https://adiprajashdq.vercel.app/" />

    <!-- Pasang tema sebelum React/CSS sempat dilukis, supaya tidak ada kilatan putih saat pengunjung memakai mode gelap. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio:theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = stored === 'dark' || stored === 'light' ? stored : system;
          var root = document.documentElement;

          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f0f0f' : '#f4f3ef');
        } catch (e) {
          /* Storage diblokir: biarkan tema terang bawaan. */
        }
      })();
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, Telegram) -->

    <meta property="og:site_name" content="Adipraja Shidqi" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://adiprajashdq.vercel.app/" />
    <meta property="og:title" content="Adipraja Shidqi — Fullstack Web Developer" />
    <meta
      property="og:description"

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    />

  </head>
